<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Name — Portfolio</title>
<meta name="description" content="Personal portfolio: projects, skills, experience and services.">
<meta property="og:type" content="website">
<meta property="og:title" content="Your Name — Portfolio">
<meta property="og:description" content="Personal portfolio: projects, skills, experience and services.">
<meta property="og:image" content="assets/og.svg">
<meta name="theme-color" content="#12141c">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>
<header class="nav" id="nav">
  <a class="logo" href="#home" id="logo">YN</a>
  <nav aria-label="Main"><ul id="menu"></ul></nav>
  <div class="tools">
    <button id="lang" type="button" aria-label="Switch language"></button>
    <button id="theme" type="button" aria-label="Toggle theme"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </div>
</header>
<main id="main">
  <section class="hero" id="home">
    <div class="wrap hero-grid">
      <div>
        <p class="role" id="h-role"></p>
        <h1 id="h-name"></h1>
        <p class="lead" id="h-bio"></p>
        <div class="cta">
          <a class="btn primary" href="#projects" data-i18n="viewWork"></a>
          <a class="btn" href="assets/cv.pdf" download data-i18n="cv"></a>
          <a class="btn" href="#contact" data-i18n="contact"></a>
        </div>
      </div>
      <div class="avatar" id="avatar" aria-hidden="true"></div>
    </div>
  </section>
  <section id="about"><div class="wrap two"><div><h2 data-i18n="about"></h2></div><div><p id="a-text" class="lead"></p><ul class="chips" id="a-int"></ul></div></div></section>
  <section id="skills"><div class="wrap"><h2 data-i18n="skills"></h2><div class="skills" id="skill-list"></div></div></section>
  <section id="projects"><div class="wrap"><h2 data-i18n="projects"></h2><div class="filters" id="filters" role="group"></div><div class="grid" id="grid"></div></div></section>
  <section id="experience"><div class="wrap"><h2 data-i18n="experience"></h2><ol class="timeline" id="timeline"></ol></div></section>
  <section id="services"><div class="wrap"><h2 data-i18n="services"></h2><div class="services" id="svc"></div></div></section>
  <section id="contact"><div class="wrap two"><div><h2 data-i18n="contact"></h2><p class="lead" data-i18n="contactText"></p><ul class="links" id="links"></ul></div>
    <form id="form" novalidate>
      <label><span data-i18n="fName"></span><input name="name" required autocomplete="name"></label>
      <label><span data-i18n="fEmail"></span><input name="email" type="email" required autocomplete="email"></label>
      <label><span data-i18n="fMsg"></span><textarea name="message" rows="5" required></textarea></label>
      <input name="_gotcha" tabindex="-1" autocomplete="off" class="hp">
      <button class="btn primary" type="submit" data-i18n="send"></button>
      <p id="status" role="status" aria-live="polite"></p>
    </form></div></section>
</main>
<footer class="wrap foot"><span id="copy"></span></footer>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
