<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>طريقك إلى ألمانيا — خدمات السفر للدراسة والعمل</title>
<meta name="description" content="نرافقكم في جميع خطوات الرحلة نحو ألمانيا: بيشايد، فحوصات لغة، قبول جامعي، معادلة شهادات، حجز مواعيد وحسابات بنكية.">
<meta property="og:type" content="website">
<meta property="og:locale" content="ar_AR">
<meta property="og:title" content="طريقك إلى ألمانيا">
<meta property="og:description" content="نرافقكم في جميع خطوات الرحلة نحو ألمانيا، من البيشايد حتى الوصول.">
<meta property="og:image" content="assets/hero.svg">
<meta name="theme-color" content="#0f6e8c">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<a class="skip" href="#main">انتقل إلى المحتوى</a>
<header class="nav">
  <a class="logo" href="#home" id="logo"></a>
  <nav id="mnav" aria-label="القائمة الرئيسية"><ul id="menu"></ul></nav>
  <div class="tools"><button id="burger" class="burger" type="button" aria-label="القائمة" aria-expanded="false" aria-controls="mnav"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><button id="theme" type="button" aria-label="تبديل الوضع الليلي/النهاري"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
</header>
<main id="main">
  <section class="hero" id="home"><div class="wrap hero-grid">
    <div><p class="role" id="h-role"></p><h1 id="h-name"></h1><p class="lead" id="h-bio"></p>
      <div class="cta"><a class="btn primary wa" id="wa" target="_blank" rel="noopener">تواصل عبر واتساب</a><a class="btn" href="#services">خدماتنا</a><a class="btn" href="#journey">خطوات الرحلة</a></div></div>
    <img class="pic" src="assets/photos/students.jpg" onerror="this.onerror=null;this.src='assets/students.svg'" alt="طلاب يستعدون للسفر إلى ألمانيا" width="340" height="340">
  </div></section>
  <section class="band"><img src="assets/photos/berlin.jpg" onerror="this.onerror=null;this.src='assets/hero.svg'" alt="معلم ألماني: بوابة براندنبورغ في برلين" loading="lazy" width="1200" height="480"></section>
  <section id="about"><div class="wrap two"><div><h2>من نحن</h2></div><div id="a-text"></div></div></section>
  <section id="services"><div class="wrap"><h2>خدماتنا</h2><div class="services" id="svc"></div></div></section>
  <section id="fields"><div class="wrap"><h2>التخصصات</h2><div class="skills" id="skill-list"></div></div></section>
  <section id="journey"><div class="wrap"><h2>رحلتك خطوة بخطوة</h2><ol class="timeline" id="timeline"></ol></div></section>
  <section id="contact"><div class="wrap two"><div><h2>تواصل معنا</h2><p class="lead">اكتب لنا عن وضعك وهدفك (دراسة أو عمل) وسنرد عليك.</p><ul class="links" id="links"></ul></div>
    <form id="form" novalidate>
      <label><span>الاسم</span><input name="name" required autocomplete="name"></label>
      <label><span>البريد الإلكتروني</span><input name="email" type="email" required autocomplete="email"></label>
      <label><span>رسالتك</span><textarea name="message" rows="5" required></textarea></label>
      <input name="_gotcha" tabindex="-1" autocomplete="off" class="hp">
      <button class="btn primary" type="submit">إرسال الرسالة</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form></div></section>
</main>
<footer class="wrap foot"><span id="copy"></span></footer>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
